<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyro – Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--text:#eceef1;--mute:#8a919c;--steel:#8fb3cc;--sand:#dcc7a8;--ease:cubic-bezier(.22,.8,.24,1);--d:'Bricolage Grotesque','Segoe UI',sans-serif;--b:'Hanken Grotesk','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--b);min-height:100dvh;display:flex;position:relative;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 560px at 88% -4%,rgba(143,179,204,.17),transparent),radial-gradient(circle 460px at 24% 104%,rgba(220,199,168,.1),transparent)}
a,button{font:inherit;color:inherit}a{text-decoration:none}button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:10px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- MENÜ ---- */
.rail{position:sticky;top:0;height:100dvh;width:248px;flex:none;z-index:2;display:flex;flex-direction:column;padding:22px 14px 16px;gap:14px;background:rgba(19,22,27,.94);border-right:1px solid rgba(255,255,255,.06);transition:width .35s var(--ease)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;min-height:40px}
.brand{display:flex;align-items:center;gap:12px;font:700 21px var(--d)}
.cbtn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--mute);display:grid;place-items:center;transition:.25s var(--ease)}
.cbtn:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
.cbtn svg{transition:transform .35s var(--ease)}

.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.ni{display:flex;align-items:center;gap:14px;min-height:42px;padding:0 12px;border-radius:12px;color:var(--mute);font-size:14.5px;white-space:nowrap;transition:color .2s,background .25s var(--ease)}
.ni:hover{color:var(--text);background:rgba(255,255,255,.045)}
.ni[aria-current]{color:var(--text);background:linear-gradient(90deg,rgba(143,179,204,.2),rgba(143,179,204,.03));box-shadow:inset 2px 0 var(--steel)}
.sep{font-size:12px;color:var(--mute);opacity:.8;padding:16px 12px 6px;white-space:nowrap}
.ni.adm{color:var(--sand)}
.ni.adm:hover{background:rgba(220,199,168,.08)}
.ni.adm[aria-current]{background:linear-gradient(90deg,rgba(220,199,168,.2),rgba(220,199,168,.03));box-shadow:inset 2px 0 var(--sand);color:var(--text)}

.foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.wfit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid rgba(220,199,168,.28);background:linear-gradient(160deg,rgba(220,199,168,.12),rgba(220,199,168,.02));color:var(--text);transition:.25s var(--ease)}
.wfit:hover{border-color:rgba(220,199,168,.5)}
.wfit .ico{width:32px;height:32px;border-radius:10px;background:rgba(220,199,168,.18);color:var(--sand);display:grid;place-items:center;flex:none}
.wfit b{font:500 14px var(--d);letter-spacing:.04em;flex:1}
.wfit .ch{color:var(--mute)}
.lang{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.05)}
.lang button{border:0;background:none;color:var(--mute);font:500 12.5px var(--b);padding:7px 0;border-radius:9px;transition:.25s}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.13);color:var(--text)}
.user{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,rgba(143,179,204,.35),rgba(220,199,168,.3));display:grid;place-items:center;font:600 15px var(--d);flex:none}
.who{flex:1;min-width:0;line-height:1.25}
.who b{display:flex;align-items:center;gap:8px;font:500 14.5px var(--b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font:500 10.5px var(--b);font-style:normal;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--mute);text-transform:uppercase}
.who small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.xp{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.xp i{display:block;height:100%;width:var(--x,0%);background:linear-gradient(90deg,var(--steel),var(--sand));border-radius:4px}
.out{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--mute);display:grid;place-items:center;flex:none;transition:.2s}
.out:hover{background:rgba(255,255,255,.07);color:var(--text)}

/* daraltılmış */
.col .rail{width:76px;padding-inline:10px}
.col .top{flex-direction:column;gap:12px;padding:0}
.col .brand .t,.col .sep,.col .wfit b,.col .wfit .ch,.col .who,.col .out,.col .ni .t{display:none}
.col .cbtn svg{transform:rotate(180deg)}
.col .ni,.col .wfit{justify-content:center;padding:0}
.col .ni{width:100%}.col .wfit{height:46px}
.col .user{justify-content:center;padding:8px 0;background:none;border:0}
.col .lang{grid-template-columns:1fr}.col .lang button:not([aria-pressed=true]){display:none}
.col .sep{display:block;height:1px;padding:0;margin:8px 10px;background:rgba(255,255,255,.07);font-size:0}

/* içerik (sadece önizleme) */
main{flex:1;min-width:0;margin:0 auto;width:100%;max-width:1240px;padding:44px clamp(20px,4vw,56px);position:relative;z-index:1}
main h1{font:300 clamp(34px,4.4vw,54px)/1 var(--d);letter-spacing:-.03em}main h1 b{font-weight:700}
main p{color:var(--mute);margin-top:10px}
.p{margin-top:26px;padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.075);background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.015));color:var(--mute);min-height:220px}

/* mobil: alt sekme çubuğu */
@media(max-width:1000px){
 .rail,.col .rail{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;border-right:0;border-top:1px solid rgba(255,255,255,.08);background:rgba(19,22,27,.97)}
 .top,.foot,.sep{display:none}
 .nav,.col .nav{flex-direction:row;gap:2px;overflow-x:auto;overflow-y:hidden;padding:0;width:100%;scrollbar-width:none}
 .ni,.col .ni{flex:1 0 76px;flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:6px 4px;font-size:11px;text-align:center;box-shadow:none!important;width:auto}
 .ni .t,.col .ni .t{display:block;white-space:nowrap}
 .ni[aria-current]{background:rgba(143,179,204,.16)}
 .ni.adm[aria-current]{background:rgba(220,199,168,.16)}
 main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-dumb" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></symbol>
<symbol id="i-post" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M7 10h10M9 21l3-7 3 7"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 006 0V3M7 11v10M17 21V3c-2 2-3 5-3 8h3"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
<symbol id="i-upd" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8M4 4v5h5M12 8v4l3 2"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h4"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></symbol>
<symbol id="i-ba" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></symbol>
<symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/></symbol>
<symbol id="i-cup" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v2a3 3 0 003 3M16 6h4v2a3 3 0 01-3 3M12 14v4M8 20h8"/></symbol>
<symbol id="i-prof" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
<symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9zM3 9h18M9 4l3 16M15 4l-3 16"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
</defs></svg>

<aside class="rail">
  <div class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h20L13 12z" fill="#8fb3cc"/><path d="M24 4v6L9 24H4v-6z" fill="#dcc7a8"/><path d="M9 24h15v-6l-6 3z" fill="#8fb3cc" opacity=".55"/></svg><span class="t">Zyro</span></div>
    <button class="cbtn" id="cb" aria-label="Menüyü daralt" aria-expanded="true"><svg class="i" style="width:16px;height:16px"><use href="#i-left"/></svg></button>
  </div>

  <nav class="nav" aria-label="Ana menü">
    <a class="ni" href="#" aria-current="page" data-k="dash"><svg class="i"><use href="#i-grid"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="work"><svg class="i"><use href="#i-dumb"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="post"><svg class="i"><use href="#i-post"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="diet"><svg class="i"><use href="#i-fork"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="prog"><svg class="i"><use href="#i-trend"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="ba"><svg class="i"><use href="#i-ba"/></svg><span class="t"></span></a>
    <div class="sep" data-k="s1"></div>
    <a class="ni" href="#" data-k="ach"><svg class="i"><use href="#i-award"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="lead"><svg class="i"><use href="#i-cup"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="comm"><svg class="i"><use href="#i-chat"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="notes"><svg class="i"><use href="#i-note"/></svg><span class="t"></span></a>
    <div class="sep" data-k="s2"></div>
    <a class="ni" href="#" data-k="calc"><svg class="i"><use href="#i-calc"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="upd"><svg class="i"><use href="#i-upd"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="prof"><svg class="i"><use href="#i-prof"/></svg><span class="t"></span></a>
    <!-- Sadece admin kullanıcılarına göster -->
    <div class="sep" data-k="s3"></div>
    <a class="ni adm" href="#" data-k="adm"><svg class="i"><use href="#i-layers"/></svg><span class="t"></span></a>
  </nav>

  <div class="foot">
    <a class="wfit" href="#" aria-label="WFIT"><span class="ico"><svg class="i" style="width:17px;height:17px"><use href="#i-gem"/></svg></span><b>WFIT</b><svg class="i ch" style="width:16px;height:16px"><use href="#i-right"/></svg></a>
    <div class="lang" role="group" aria-label="Dil"><button data-l="en" aria-pressed="false">EN</button><button data-l="tr" aria-pressed="true">TR</button></div>
    <div class="user">
      <div class="av">K</div>
      <div class="who"><b>Kullanıcı <em data-k="role"></em></b><small data-k="lvl"></small><div class="xp"><i style="--x:0%"></i></div></div>
      <button class="out" aria-label="Çıkış yap"><svg class="i" style="width:18px;height:18px"><use href="#i-out"/></svg></button>
    </div>
  </div>
</aside>

<main>
  <h1>İçerik <b>alanı</b></h1>
  <p>Bu sayfa sadece menünün görünümünü göstermek için. Sol üstteki oku kullanarak menüyü daraltabilirsin.</p>
  <div class="p">Sayfa içeriği buraya gelir.</div>
</main>

<script>
const L={
 tr:{dash:'Panel',work:'Antrenmanlar',post:'Duruş',diet:'Beslenme',prog:'İlerleme',ba:'Önce / Sonra',s1:'Topluluk',ach:'Başarımlar',lead:'Liderlik',comm:'Yorumlar',notes:'Notlar',s2:'Araçlar',calc:'Hesaplayıcılar',upd:'Güncellemeler',prof:'Profil',s3:'Yönetici paneli',adm:'Admin merkezi',role:'Üye',lvl:'Seviye 1 · 0 XP',col:'Menüyü daralt',exp:'Menüyü genişlet'},
 en:{dash:'Dashboard',work:'Workouts',post:'Posture',diet:'Diet & Nutrition',prog:'Progress',ba:'Before/After',s1:'Community',ach:'Achievements',lead:'Leaderboard',comm:'Comments',notes:'Notes',s2:'Tools',calc:'Calculators',upd:'Updates',prof:'Profile',s3:'Admin panel',adm:'Admin center',role:'Member',lvl:'Level 1 · 0 XP',col:'Collapse menu',exp:'Expand menu'}
};
let lang='tr';
function render(){
  const t=L[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-k]').forEach(e=>{const v=t[e.dataset.k];if(!v)return;
    const s=e.querySelector('.t');(s||e).textContent=v;
    if(e.classList.contains('ni')){e.title=v;e.setAttribute('aria-label',v)}});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const c=document.body.classList.contains('col');$('#cb').setAttribute('aria-label',c?t.exp:t.col);
}
const $=s=>document.querySelector(s);
$('.lang').onclick=e=>{const b=e.target.closest('button');if(b){lang=b.dataset.l;render()}};
$('#cb').onclick=()=>{const c=document.body.classList.toggle('col');$('#cb').setAttribute('aria-expanded',!c);
  try{localStorage.setItem('zyro-menu',c?'1':'0')}catch(e){}render()};
$('.nav').onclick=e=>{const a=e.target.closest('.ni');if(!a)return;e.preventDefault();
  document.querySelectorAll('.ni').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page')};
try{if(localStorage.getItem('zyro-menu')==='1')document.body.classList.add('col')}catch(e){}
render();
</script>
</body>
</html>
