<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyro – Diyet ve beslenme</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--text:#eceef1;--mute:#8a919c;--steel:#8fb3cc;--sand:#dcc7a8;--ease:cubic-bezier(.22,.8,.24,1);--d:'Bricolage Grotesque','Segoe UI',sans-serif;--b:'Hanken Grotesk','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--b);min-height:100dvh;display:flex;position:relative;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle 560px at 88% -4%,rgba(143,179,204,.17),transparent),radial-gradient(circle 460px at 24% 104%,rgba(220,199,168,.1),transparent)}
a,button{font:inherit;color:inherit}a{text-decoration:none}button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:10px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- MENÜ ---- */
.rail{position:sticky;top:0;height:100dvh;width:248px;flex:none;z-index:2;display:flex;flex-direction:column;padding:22px 14px 16px;gap:14px;background:rgba(19,22,27,.94);border-right:1px solid rgba(255,255,255,.06);transition:width .35s var(--ease)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;min-height:40px}
.brand{display:flex;align-items:center;gap:12px;font:700 21px var(--d)}
.cbtn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--mute);display:grid;place-items:center;transition:.25s var(--ease)}
.cbtn:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
.cbtn svg{transition:transform .35s var(--ease)}

.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.ni{display:flex;align-items:center;gap:14px;min-height:42px;padding:0 12px;border-radius:12px;color:var(--mute);font-size:14.5px;white-space:nowrap;transition:color .2s,background .25s var(--ease)}
.ni:hover{color:var(--text);background:rgba(255,255,255,.045)}
.ni[aria-current]{color:var(--text);background:linear-gradient(90deg,rgba(143,179,204,.2),rgba(143,179,204,.03));box-shadow:inset 2px 0 var(--steel)}
.sep{font-size:12px;color:var(--mute);opacity:.8;padding:16px 12px 6px;white-space:nowrap}
.ni.adm{color:var(--sand)}
.ni.adm:hover{background:rgba(220,199,168,.08)}
.ni.adm[aria-current]{background:linear-gradient(90deg,rgba(220,199,168,.2),rgba(220,199,168,.03));box-shadow:inset 2px 0 var(--sand);color:var(--text)}

.foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.wfit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid rgba(220,199,168,.28);background:linear-gradient(160deg,rgba(220,199,168,.12),rgba(220,199,168,.02));color:var(--text);transition:.25s var(--ease)}
.wfit:hover{border-color:rgba(220,199,168,.5)}
.wfit .ico{width:32px;height:32px;border-radius:10px;background:rgba(220,199,168,.18);color:var(--sand);display:grid;place-items:center;flex:none}
.wfit b{font:500 14px var(--d);letter-spacing:.04em;flex:1}
.wfit .ch{color:var(--mute)}
.lang{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.05)}
.lang button{border:0;background:none;color:var(--mute);font:500 12.5px var(--b);padding:7px 0;border-radius:9px;transition:.25s}
.lang button[aria-pressed=true]{background:rgba(255,255,255,.13);color:var(--text)}
.user{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,rgba(143,179,204,.35),rgba(220,199,168,.3));display:grid;place-items:center;font:600 15px var(--d);flex:none}
.who{flex:1;min-width:0;line-height:1.25}
.who b{display:flex;align-items:center;gap:8px;font:500 14.5px var(--b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font:500 10.5px var(--b);font-style:normal;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--mute);text-transform:uppercase}
.who small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.xp{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.xp i{display:block;height:100%;width:var(--x,0%);background:linear-gradient(90deg,var(--steel),var(--sand));border-radius:4px}
.out{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--mute);display:grid;place-items:center;flex:none;transition:.2s}
.out:hover{background:rgba(255,255,255,.07);color:var(--text)}

/* daraltılmış */
.col .rail{width:76px;padding-inline:10px}
.col .top{flex-direction:column;gap:12px;padding:0}
.col .brand .t,.col .sep,.col .wfit b,.col .wfit .ch,.col .who,.col .out,.col .ni .t{display:none}
.col .cbtn svg{transform:rotate(180deg)}
.col .ni,.col .wfit{justify-content:center;padding:0}
.col .ni{width:100%}.col .wfit{height:46px}
.col .user{justify-content:center;padding:8px 0;background:none;border:0}
.col .lang{grid-template-columns:1fr}.col .lang button:not([aria-pressed=true]){display:none}
.col .sep{display:block;height:1px;padding:0;margin:8px 10px;background:rgba(255,255,255,.07);font-size:0}

/* içerik (sadece önizleme) */
main{flex:1;min-width:0;margin:0 auto;width:100%;max-width:1240px;padding:44px clamp(20px,4vw,56px);position:relative;z-index:1}
main h1{font:300 clamp(34px,4.4vw,54px)/1 var(--d);letter-spacing:-.03em}main h1 b{font-weight:700}
main p{color:var(--mute);margin-top:10px}
.p{margin-top:26px;padding:26px;border-radius:24px;border:1px solid rgba(255,255,255,.075);background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.015));color:var(--mute);min-height:220px}

.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c5{grid-column:span 5}.c4{grid-column:span 4}
.pn{border-radius:24px;border:1px solid rgba(255,255,255,.075);background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.015));padding:26px;min-width:0}
.lab{color:var(--mute);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lab b{font:500 20px var(--d);color:var(--text)}
.pill{padding:10px 18px;border-radius:999px;border:1px solid rgba(220,199,168,.3);background:rgba(220,199,168,.08);color:var(--sand);font:500 14px var(--b);white-space:nowrap;transition:.25s}
.pill:hover{background:rgba(220,199,168,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--text);color:#13161b;border:0;border-radius:999px;padding:12px 24px;font:600 14.5px var(--b);transition:.3s var(--ease)}
.btn:hover{background:var(--sand);transform:translateY(-1px)}
.ghost{background:none;border:1px solid rgba(255,255,255,.14);color:var(--mute);border-radius:999px;padding:10px 18px;font:500 13.5px var(--b);transition:.25s}
.ghost:hover{color:var(--text);border-color:var(--steel)}
.in{width:100%;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;transition:border-color .25s}
.in:focus{outline:0;border-color:var(--steel)}.in::placeholder{color:#5f6672}
.cap{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
.tag{padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.07);font:400 12.5px var(--b);color:var(--text)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.05);color:var(--mute);font-size:14px;transition:.2s;flex:none;display:grid;place-items:center}
.x:hover{background:rgba(217,163,163,.18);color:#d9a3a3}
.empty{border:1px dashed rgba(255,255,255,.14);border-radius:18px;padding:30px;color:var(--mute);text-align:center}
.err{color:#d9a3a3;font-size:13px;min-height:20px;margin-top:8px}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:500 13px var(--b);padding:8px 14px;border-radius:9px}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.14);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--mute);border-radius:999px;padding:8px 15px;font-size:13.5px;white-space:nowrap;transition:.25s var(--ease)}
.chips button:hover{color:var(--text)}
.chips button[aria-pressed=true]{color:var(--text);border-color:var(--steel);background:rgba(143,179,204,.16)}
.toast{position:fixed;right:24px;bottom:24px;z-index:50;display:flex;gap:14px;align-items:center;padding:16px 22px 16px 16px;border-radius:22px;background:rgba(30,34,41,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.45);transform:translateY(30px) scale(.97);opacity:0;pointer-events:none;transition:.5s var(--ease);max-width:350px}
.toast.show{transform:none;opacity:1}
.ic{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--steel),var(--sand));display:grid;place-items:center;color:#13161b;flex:none}
.toast b{font:500 16px var(--d);display:block}.toast span{color:var(--mute);font-size:13px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(max-width:1000px){.c8,.c7,.c5,.c4{grid-column:span 12}.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
@media(max-width:640px){input,select,textarea{font-size:16px!important}.pn{padding:20px}}

.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.dy{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:18px;padding:12px 8px 11px;text-align:center;color:var(--mute);transition:.3s var(--ease)}
.dy small{display:block;font-size:12px}.dy b{display:block;font:500 21px var(--d);color:var(--text);margin:2px 0 9px}
.dy i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 6px}
.dy i u{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,var(--steel),var(--sand));transition:width .6s var(--ease)}
.dy:hover{border-color:rgba(255,255,255,.2)}
.dy[aria-selected=true]{border-color:var(--steel);background:linear-gradient(160deg,rgba(143,179,204,.2),rgba(143,179,204,.04))}
.dy.td small{color:var(--sand)}
.mac{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center}
.rb{position:relative;width:190px;height:190px;display:grid;place-items:center}
.rb svg{position:absolute;inset:0;transform:rotate(-90deg)}.rb circle{fill:none;stroke-width:8;stroke-linecap:round}
.rb .t{stroke:rgba(255,255,255,.07)}.rb .v{stroke:url(#rg);stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease)}
.rb .v.over{stroke:#c99a9a}
.rc{text-align:center}.rc b{font:500 38px/1 var(--d);letter-spacing:-.02em}.rc span{display:block;color:var(--mute);font-size:13px;margin-top:5px}
.bars{display:flex;flex-direction:column;gap:22px}
.br .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:14px}.br .h span{color:var(--mute)}.br .h b{font:500 16px var(--d)}
.br .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.br .tr i{display:block;height:100%;width:0;border-radius:8px;background:var(--c);transition:width .9s var(--ease)}
.ged{margin-top:24px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07)}
.gf{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{position:relative}.fld .in{padding-right:52px}
.fld em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:12px;pointer-events:none}
.fl .cap,.gf .cap{margin-top:0}
.drop{display:grid;place-items:center;gap:8px;min-height:150px;border:1.5px dashed rgba(255,255,255,.16);border-radius:18px;color:var(--mute);cursor:pointer;transition:.25s;text-align:center;padding:16px}
.drop:hover{border-color:var(--steel);color:var(--text)}.drop img{max-width:100%;max-height:220px;border-radius:12px}
.drop input{display:none}
.row2{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.ml{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,.07)}
.ml:first-child{border:0;padding-top:0}.ml b{font-weight:500;display:block}.ml>div:first-child{min-width:0;flex:1}.ml span{color:var(--mute);font-size:13px}
.ml .k{font:500 18px var(--d);white-space:nowrap}
.mt{font-size:11.5px;padding:2px 9px;border-radius:999px;background:rgba(220,199,168,.14);color:var(--sand);margin-right:8px}
.mlist{max-height:480px;overflow:auto}
@media(max-width:640px){.mac{grid-template-columns:1fr;justify-items:center;gap:28px}.bars{width:100%}.gf{grid-template-columns:1fr 1fr}.wk7{gap:6px}.dy{padding:10px 2px 9px;border-radius:14px}.dy b{font-size:17px}.dy small{font-size:11px}}

/* mobil: alt sekme çubuğu */
@media(max-width:1000px){
 .rail,.col .rail{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;border-right:0;border-top:1px solid rgba(255,255,255,.08);background:rgba(19,22,27,.97)}
 .top,.foot,.sep{display:none}
 .nav,.col .nav{flex-direction:row;gap:2px;overflow-x:auto;overflow-y:hidden;padding:0;width:100%;scrollbar-width:none}
 .ni,.col .ni{flex:1 0 76px;flex-direction:column;justify-content:center;gap:3px;min-height:54px;padding:6px 4px;font-size:11px;text-align:center;box-shadow:none!important;width:auto}
 .ni .t,.col .ni .t{display:block;white-space:nowrap}
 .ni[aria-current]{background:rgba(143,179,204,.16)}
 .ni.adm[aria-current]{background:rgba(220,199,168,.16)}
 main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-dumb" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></symbol>
<symbol id="i-post" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M7 10h10M9 21l3-7 3 7"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 006 0V3M7 11v10M17 21V3c-2 2-3 5-3 8h3"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
<symbol id="i-upd" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8M4 4v5h5M12 8v4l3 2"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h4"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></symbol>
<symbol id="i-ba" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="16" rx="2"/></symbol>
<symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/></symbol>
<symbol id="i-cup" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v2a3 3 0 003 3M16 6h4v2a3 3 0 01-3 3M12 14v4M8 20h8"/></symbol>
<symbol id="i-prof" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
<symbol id="i-gem" viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9zM3 9h18M9 4l3 16M15 4l-3 16"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb3cc"/><stop offset="1" stop-color="#dcc7a8"/></linearGradient>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.4"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16zM13 7l4 4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
</defs></svg>

<aside class="rail">
  <div class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 4h20L13 12z" fill="#8fb3cc"/><path d="M24 4v6L9 24H4v-6z" fill="#dcc7a8"/><path d="M9 24h15v-6l-6 3z" fill="#8fb3cc" opacity=".55"/></svg><span class="t">Zyro</span></div>
    <button class="cbtn" id="cb" aria-label="Menüyü daralt" aria-expanded="true"><svg class="i" style="width:16px;height:16px"><use href="#i-left"/></svg></button>
  </div>

  <nav class="nav" aria-label="Ana menü">
    <a class="ni" href="#" data-k="dash"><svg class="i"><use href="#i-grid"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="work"><svg class="i"><use href="#i-dumb"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="post"><svg class="i"><use href="#i-post"/></svg><span class="t"></span></a>
    <a class="ni" href="#" aria-current="page" data-k="diet"><svg class="i"><use href="#i-fork"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="prog"><svg class="i"><use href="#i-trend"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="ba"><svg class="i"><use href="#i-ba"/></svg><span class="t"></span></a>
    <div class="sep" data-k="s1"></div>
    <a class="ni" href="#" data-k="ach"><svg class="i"><use href="#i-award"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="lead"><svg class="i"><use href="#i-cup"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="comm"><svg class="i"><use href="#i-chat"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="notes"><svg class="i"><use href="#i-note"/></svg><span class="t"></span></a>
    <div class="sep" data-k="s2"></div>
    <a class="ni" href="#" data-k="calc"><svg class="i"><use href="#i-calc"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="upd"><svg class="i"><use href="#i-upd"/></svg><span class="t"></span></a>
    <a class="ni" href="#" data-k="prof"><svg class="i"><use href="#i-prof"/></svg><span class="t"></span></a>
    <!-- Sadece admin kullanıcılarına göster -->
    <div class="sep" data-k="s3"></div>
    <a class="ni adm" href="#" data-k="adm"><svg class="i"><use href="#i-layers"/></svg><span class="t"></span></a>
  </nav>

  <div class="foot">
    <a class="wfit" href="#" aria-label="WFIT"><span class="ico"><svg class="i" style="width:17px;height:17px"><use href="#i-gem"/></svg></span><b>WFIT</b><svg class="i ch" style="width:16px;height:16px"><use href="#i-right"/></svg></a>
    <div class="lang" role="group" aria-label="Dil"><button data-l="en" aria-pressed="false">EN</button><button data-l="tr" aria-pressed="true">TR</button></div>
    <div class="user">
      <div class="av">K</div>
      <div class="who"><b>Kullanıcı <em data-k="role"></em></b><small data-k="lvl"></small><div class="xp"><i style="--x:0%"></i></div></div>
      <button class="out" aria-label="Çıkış yap"><svg class="i" style="width:18px;height:18px"><use href="#i-out"/></svg></button>
    </div>
  </div>
</aside>

<main>
  <header class="hd">
    <div><h1>Diyet <b>ve beslenme</b></h1><p>Yemeklerin fotoğrafını çek, AI ile analiz et ve makrolarını takip et</p></div>
  </header>
  <div class="g">
    <section class="pn c12" aria-label="Haftalık geçmiş">
      <div class="lab"><b>Haftalık geçmiş</b><span id="range"></span></div>
      <div class="wk7" id="wk7" role="tablist"></div>
    </section>

    <section class="pn c12" aria-label="Makro durumu">
      <div class="lab"><b id="mt">Bugünkü makro durumu</b><button class="ghost" id="gedit">Hedefleri düzenle</button></div>
      <div class="mac">
        <div class="rb"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="42"/><circle class="v" id="rv" cx="50" cy="50" r="42" pathLength="1"/></svg>
          <div class="rc"><b id="kc">0</b><span id="kg">/ 2000 kcal</span></div></div>
        <div class="bars" id="bars"></div>
      </div>
      <div class="ged" id="ged" hidden>
        <div class="gf">
          <div><label class="cap" for="gk">Kalori</label><div class="fld"><input class="in" id="gk" inputmode="numeric"><em>kcal</em></div></div>
          <div><label class="cap" for="gp">Protein</label><div class="fld"><input class="in" id="gp" inputmode="numeric"><em>g</em></div></div>
          <div><label class="cap" for="gc">Karbonhidrat</label><div class="fld"><input class="in" id="gc" inputmode="numeric"><em>g</em></div></div>
          <div><label class="cap" for="gf">Yağ</label><div class="fld"><input class="in" id="gf" inputmode="numeric"><em>g</em></div></div>
        </div>
        <div class="row2"><button class="ghost" id="gcancel">Vazgeç</button><button class="btn" id="gsave">Hedefleri kaydet</button></div>
      </div>
    </section>

    <section class="pn c7" aria-label="Öğün ekle">
      <div class="lab"><b>Öğün ekle</b><div class="seg" id="tabs"><button data-t="m" aria-pressed="true">Manuel</button><button data-t="p" aria-pressed="false">Fotoğraf (AI)</button></div></div>
      <label class="cap" for="mn">Yemek adı</label><input class="in" id="mn" placeholder="ör: Yulaf ezmesi" autocomplete="off">
      <div class="chips" id="tags" role="group" aria-label="Öğün etiketi" style="margin-top:14px"></div>
      <div id="pm" style="margin-top:18px">
        <div class="fl">
          <div><label class="cap" for="mk">Kalori</label><div class="fld"><input class="in" id="mk" inputmode="decimal" placeholder="0"><em>kcal</em></div></div>
          <div><label class="cap" for="mp">Protein</label><div class="fld"><input class="in" id="mp" inputmode="decimal" placeholder="0"><em>g</em></div></div>
          <div><label class="cap" for="mc">Karbonhidrat</label><div class="fld"><input class="in" id="mc" inputmode="decimal" placeholder="0"><em>g</em></div></div>
          <div><label class="cap" for="mf">Yağ</label><div class="fld"><input class="in" id="mf" inputmode="decimal" placeholder="0"><em>g</em></div></div>
        </div>
      </div>
      <div id="pp" hidden style="margin-top:18px">
        <label class="drop" id="drop"><input type="file" id="file" accept="image/*"><div id="dropc"><svg class="i" style="width:28px;height:28px"><use href="#i-img"/></svg><div>Yemeğin fotoğrafını seç veya çek</div></div></label>
        <div class="row2"><button class="ghost" id="analyze">AI ile analiz et</button></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <div class="row2" style="margin-top:6px"><button class="ghost" id="clear">Temizle</button><button class="btn" id="msave"><svg class="i" style="width:16px;height:16px"><use href="#i-check"/></svg>Öğünü kaydet</button></div>
    </section>

    <section class="pn c5" aria-label="Öğünler">
      <div class="lab"><b id="lt">Bugün yenilenler</b><span class="tag" id="lc">0 öğün</span></div>
      <div class="mlist" id="ml"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
const L={
 tr:{dash:'Panel',work:'Antrenmanlar',post:'Duruş',diet:'Beslenme',prog:'İlerleme',ba:'Önce / Sonra',s1:'Topluluk',ach:'Başarımlar',lead:'Liderlik',comm:'Yorumlar',notes:'Notlar',s2:'Araçlar',calc:'Hesaplayıcılar',upd:'Güncellemeler',prof:'Profil',s3:'Yönetici paneli',adm:'Admin merkezi',role:'Üye',lvl:'Seviye 1 · 0 XP',col:'Menüyü daralt',exp:'Menüyü genişlet'},
 en:{dash:'Dashboard',work:'Workouts',post:'Posture',diet:'Diet & Nutrition',prog:'Progress',ba:'Before/After',s1:'Community',ach:'Achievements',lead:'Leaderboard',comm:'Comments',notes:'Notes',s2:'Tools',calc:'Calculators',upd:'Updates',prof:'Profile',s3:'Admin panel',adm:'Admin center',role:'Member',lvl:'Level 1 · 0 XP',col:'Collapse menu',exp:'Expand menu'}
};
let lang='tr';
function render(){
  const t=L[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-k]').forEach(e=>{const v=t[e.dataset.k];if(!v)return;
    const s=e.querySelector('.t');(s||e).textContent=v;
    if(e.classList.contains('ni')){e.title=v;e.setAttribute('aria-label',v)}});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  const c=document.body.classList.contains('col');$('#cb').setAttribute('aria-label',c?t.exp:t.col);
}
const $=s=>document.querySelector(s);
$('.lang').onclick=e=>{const b=e.target.closest('button');if(b){lang=b.dataset.l;render()}};
$('#cb').onclick=()=>{const c=document.body.classList.toggle('col');$('#cb').setAttribute('aria-expanded',!c);
  try{localStorage.setItem('zyro-menu',c?'1':'0')}catch(e){}render()};
$('.nav').onclick=e=>{const a=e.target.closest('.ni');if(!a)return;e.preventDefault();
  document.querySelectorAll('.ni').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page')};
try{if(localStorage.getItem('zyro-menu')==='1')document.body.classList.add('col')}catch(e){}
render();
(()=>{
const MONL=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'],MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const DAY=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],DS=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const num=el=>parseFloat(String(el.value).replace(',','.'))||0;
let tt;
function toast(t,s){const el=$('#toast');
  el.innerHTML='<div class="ic"><svg class="i" style="width:22px;height:22px"><use href="#i-check"/></svg></div><div><b>'+t+'</b><span>'+s+'</span></div>';
  el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3600)}

const TAGS=['Kahvaltı','Öğle','Akşam','Ara öğün','Diğer'];
const MC={p:'#8fb3cc',c:'#dcc7a8',f:'#c99a9a'};
let goals={k:2000,p:170,c:110,f:70},meals={},sel=ago(0),tag='Diğer',photo=null,mid=1,first=true;
const TODAY=ago(0);
const dm=d=>meals[d]||[];
const sum=d=>dm(d).reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
const fm=n=>String(Math.round(n*10)/10).replace('.',',');
function week(){
  const r=[];for(let i=6;i>=0;i--)r.push(ago(i));
  $('#range').textContent=pd(r[0]).getDate()+' '+MON[pd(r[0]).getMonth()]+' – '+pd(r[6]).getDate()+' '+MON[pd(r[6]).getMonth()];
  $('#wk7').innerHTML=r.map(d=>{const D=pd(d),w=Math.min(100,Math.round(sum(d).k/goals.k*100));
    return '<button class="dy'+(d===TODAY?' td':'')+'" role="tab" aria-selected="'+(d===sel)+'" data-d="'+d+'"><small>'+(d===TODAY?'Bugün':DS[D.getDay()])+'</small><b>'+D.getDate()+'</b><i><u style="--w:'+w+'%"></u></i></button>'}).join('');
}
function macros(){
  const s=sum(sel),D=pd(sel);
  $('#mt').textContent=sel===TODAY?'Bugünkü makro durumu':D.getDate()+' '+MONL[D.getMonth()]+' makro durumu';
  $('#kc').textContent=Math.round(s.k).toLocaleString('tr-TR');
  const left=goals.k-s.k;$('#kg').textContent='/ '+goals.k+' kcal · '+(left>=0?Math.round(left)+' kalan':Math.round(-left)+' fazla');
  const v=$('#rv');v.classList.toggle('over',left<0);
  requestAnimationFrame(()=>{v.style.strokeDashoffset=1-Math.min(s.k/goals.k,1)});
  $('#bars').innerHTML=[['p','Protein'],['c','Karbonhidrat'],['f','Yağ']].map(([k,n])=>
    '<div class="br"><div class="h"><span>'+n+'</span><b>'+fm(s[k])+' / '+goals[k]+' g</b></div><div class="tr"><i style="--c:'+MC[k]+'" data-w="'+Math.min(100,s[k]/goals[k]*100)+'"></i></div></div>').join('');
  requestAnimationFrame(()=>document.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'));
}
function list(){
  const a=dm(sel);$('#lt').textContent=sel===TODAY?'Bugün yenilenler':'Bu gün yenilenler';$('#lc').textContent=a.length+' öğün';
  $('#ml').innerHTML=a.length?a.map(m=>'<div class="ml"><div><b>'+esc(m.name)+'</b><span><i class="mt" style="font-style:normal">'+m.tag+'</i>P '+fm(m.p)+' · K '+fm(m.c)+' · Y '+fm(m.f)+'</span></div><div class="k">'+Math.round(m.k)+' <small style="font:400 12px var(--b);color:var(--mute)">kcal</small></div><button class="x" data-id="'+m.id+'" aria-label="Sil">✕</button></div>').join(''):'<div class="empty">Henüz yemek eklenmedi.</div>';
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function all(){week();macros();list()}
function tags(){$('#tags').innerHTML=TAGS.map(t=>'<button data-g="'+t+'" aria-pressed="'+(t===tag)+'">'+t+'</button>').join('')}
function tab(t){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));$('#pm').hidden=t!=='m';$('#pp').hidden=t!=='p'}
function clear(){['mn','mk','mp','mc','mf'].forEach(i=>$('#'+i).value='');photo=null;$('#file').value='';$('#dropc').innerHTML='<svg class="i" style="width:28px;height:28px"><use href="#i-img"/></svg><div>Yemeğin fotoğrafını seç veya çek</div>';$('#err').textContent=''}

$('#wk7').onclick=e=>{const b=e.target.closest('[data-d]');if(b){sel=b.dataset.d;all()}};
$('#tags').onclick=e=>{const b=e.target.closest('[data-g]');if(b){tag=b.dataset.g;tags()}};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)tab(b.dataset.t)};
$('#clear').onclick=clear;
$('#msave').onclick=()=>{
  const name=$('#mn').value.trim(),k=num($('#mk'));
  if(!name||k<=0){$('#err').textContent='Yemek adı ve kalori değerini gir.';return}
  (meals[sel]=meals[sel]||[]).push({id:mid++,name,tag,k,p:num($('#mp')),c:num($('#mc')),f:num($('#mf'))});
  clear();all();toast('Öğün kaydedildi',esc(name)+' · '+Math.round(k)+' kcal')};
$('#ml').onclick=e=>{const b=e.target.closest('[data-id]');if(b){meals[sel]=dm(sel).filter(m=>m.id!==+b.dataset.id);all()}};
$('#gedit').onclick=()=>{const g=$('#ged');g.hidden=!g.hidden;if(!g.hidden){$('#gk').value=goals.k;$('#gp').value=goals.p;$('#gc').value=goals.c;$('#gf').value=goals.f}};
$('#gcancel').onclick=()=>{$('#ged').hidden=true};
$('#gsave').onclick=()=>{const g={k:num($('#gk')),p:num($('#gp')),c:num($('#gc')),f:num($('#gf'))};
  if(Object.values(g).some(v=>!(v>0))){toast('Hedefler kaydedilmedi','Tüm değerler 0\'dan büyük olmalı');return}
  goals=g;$('#ged').hidden=true;all();toast('Hedefler güncellendi','Yeni makro hedeflerin kaydedildi')};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;photo=f;
  $('#dropc').innerHTML='<img alt="Seçilen yemek fotoğrafı" src="'+URL.createObjectURL(f)+'">'};
// AI analizi: gerçek uygulamada mevcut analiz fonksiyonuna bağlanır (window.analyzeMeal)
$('#analyze').onclick=async()=>{
  if(!photo){$('#err').textContent='Önce bir fotoğraf seç.';return}
  if(typeof window.analyzeMeal!=='function'){toast('AI analizi bağlı değil','Bu önizlemede analiz çalışmaz');return}
  try{const r=await window.analyzeMeal(photo);$('#mn').value=r.name||'';$('#mk').value=r.k||'';$('#mp').value=r.p||'';$('#mc').value=r.c||'';$('#mf').value=r.f||'';tab('m');toast('Analiz tamamlandı','Değerleri kontrol edip kaydet')}
  catch(err){toast('Analiz başarısız','Lütfen tekrar dene')}};
// --- SADECE TASARIM ÖNİZLEMESİ: örnek veri (gerçek uygulamaya taşınmayacak) ---
let demo=false;
$('#demo').onclick=()=>{demo=!demo;meals={};
  if(demo){const A=(d,n,t,k,p,c,f)=>(meals[ago(d)]=meals[ago(d)]||[]).push({id:mid++,name:n,tag:t,k,p,c,f});
    A(0,'Yulaf ezmesi','Kahvaltı',380,14,62,8);A(0,'Tavuklu pilav','Öğle',640,46,70,16);
    A(1,'Yumurta ve peynir','Kahvaltı',420,28,6,30);A(1,'Izgara tavuk','Akşam',560,52,20,28);A(2,'Lor peyniri','Ara öğün',220,24,6,10);A(2,'Mercimek çorbası','Akşam',310,18,44,6);A(3,'Tavuk dürüm','Öğle',690,42,64,26)}
  $('#demo').textContent=demo?'Örnek veriyi temizle':'Örnek veriyi yükle';all()};
tags();tab('m');all();

})();
</script>
</body>
</html>
