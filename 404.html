<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zyro</title>
  </head>
  <body>
    <script>
      (function () {
        var l = window.location;
        var base = l.pathname.indexOf('/zyro/') === 0 || l.pathname === '/zyro' ? '/zyro' : '';
        var path = l.pathname;
        if (base && path.indexOf(base) === 0) path = path.slice(base.length);
        path = path.replace(/^\/+/, '');
        var target = l.origin + (base ? base + '/' : '/') + '?p=' + encodeURIComponent(path) + (l.hash || '');
        l.replace(target);
      })();
    </script>
  </body>
</html>
